backend:
  name: git-gateway
  branch: main

# Para desarrollo local, usa esto en vez de git-gateway:
# backend:
#   name: test-repo

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

site_url: https://campingfrailejon.netlify.app
logo_url: /assets/icons/frailejon-icon.svg

locale: es

# Colección: Salidas (Rutas de tracking)
collections:
  - name: "salidas"
    label: "🥾 Salidas"
    folder: "content/salidas"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string", required: true }
      - { label: "Título (Inglés)", name: "title_en", widget: "string", required: true }
      - { label: "Fecha de salida", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: "HH:mm", required: true }
      - { label: "Dificultad", name: "dificultad", widget: "select", options: ["fácil", "moderada", "difícil", "extrema"], default: "moderada" }
      - { label: "Distancia (km)", name: "distancia", widget: "number", value_type: "float", min: 0, step: 0.1 }
      - { label: "Tiempo estimado", name: "tiempo", widget: "string", hint: "Ej: 4h 30min" }
      - { label: "Elevación máxima (m)", name: "elevacion_max", widget: "number", value_type: "int", required: false }
      - { label: "Punto de encuentro", name: "punto_encuentro", widget: "string" }
      - { label: "Descripción", name: "description", widget: "markdown" }
      - { label: "Descripción (Inglés)", name: "description_en", widget: "markdown" }
      - { label: "Precauciones", name: "precauciones", widget: "list", field: { label: "Precaución", name: "precaucion", widget: "string" }, required: false }
      - { label: "Qué llevar", name: "equipo", widget: "list", field: { label: "Ítem", name: "item", widget: "string" }, required: false }
      - { label: "Imagen de portada", name: "image", widget: "image", required: true }
      - { label: "Track GPX", name: "gpx", widget: "file", required: false, hint: "Archivo .gpx de la ruta" }
      - { label: "Coordenadas inicio", name: "coords", widget: "object", fields:
          - { label: "Latitud", name: "lat", widget: "number", value_type: "float" }
          - { label: "Longitud", name: "lng", widget: "number", value_type: "float" }
        }
      - { label: "Estado", name: "estado", widget: "select", options: ["programada", "en curso", "completada", "cancelada"], default: "programada" }
      - { label: "Destacado", name: "featured", widget: "boolean", default: false, hint: "Marcar para mostrar en home" }

  # Colección: Actividades / Eventos
  - name: "actividades"
    label: "📅 Actividades"
    folder: "content/actividades"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string", required: true }
      - { label: "Título (Inglés)", name: "title_en", widget: "string", required: true }
      - { label: "Fecha y hora", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: "HH:mm", required: true }
      - { label: "Tipo de actividad", name: "tipo", widget: "select", options: ["taller", "charla", "caminata guiada", "observación astronómica", "yoga", "otro"], default: "taller" }
      - { label: "Descripción", name: "description", widget: "markdown" }
      - { label: "Descripción (Inglés)", name: "description_en", widget: "markdown" }
      - { label: "Imagen", name: "image", widget: "image", required: true }
      - { label: "Precio", name: "precio", widget: "string", required: false, hint: "Ej: Gratis / $20.000 COP" }
      - { label: "Cupo máximo", name: "cupo", widget: "number", value_type: "int", required: false }
      - { label: "Instructor/Guía", name: "instructor", widget: "string", required: false }
      - { label: "Estado", name: "estado", widget: "select", options: ["próximamente", "inscripciones abiertas", "cupo lleno", "finalizada", "cancelada"], default: "inscripciones abiertas" }
      - { label: "Destacado", name: "featured", widget: "boolean", default: false }

  # Colección: Galería
  - name: "galeria"
    label: "🖼️ Galería"
    folder: "content/galeria"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string", required: true }
      - { label: "Título (Inglés)", name: "title_en", widget: "string", required: true }
      - { label: "Imagen", name: "image", widget: "image", required: true }
      - { label: "Descripción", name: "description", widget: "text", required: false }
      - { label: "Descripción (Inglés)", name: "description_en", widget: "text", required: false }
      - { label: "Autor", name: "autor", widget: "string", required: false }
      - { label: "Fecha", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "Categoría", name: "categoria", widget: "select", options: ["paisaje", "fauna", "flora", "gente", "dron", "evento"], default: "paisaje" }
      - { label: "Destacada", name: "featured", widget: "boolean", default: false }
